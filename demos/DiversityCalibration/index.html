<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Token Probability Demo</title>
  <meta name="description" content="A small interactive token probability barplot demo.">

  <link href="https://fonts.googleapis.com/css?family=Google+Sans|Noto+Sans|Castoro" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

  <style>
    :root {
      --page-pad: clamp(14px, 3vw, 32px);
      --plot-max-width: 1080px;
      --chart-height: clamp(260px, 44vh, 420px);
      --chart-inner-pad-top: clamp(16px, 2.5vw, 26px);
      --bar-gap: 8px;
      --bar-group-width: 36px;
      --bar-width: 24px;
      --value-font-size: 10px;
      --panel-bg: #f7f8ff;
      --panel-border: #e2e6ff;
      --blue: #3273dc;
      --blue-bg: #eef3ff;
      --blue-border: #d9e4ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      overflow-x: hidden;
    }

    body {
      margin: 0;
      font-family: "Google Sans", "Noto Sans", Arial, sans-serif;
      color: #111;
      background: #fff;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .hero-body {
      padding: clamp(2rem, 6vw, 4rem) var(--page-pad);
    }

    .hero .conf-text {
      color: #e90b0b;
      font-size: clamp(1.2rem, 3.5vw, 2.2rem);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .publication-title {
      word-break: break-word;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
    }

    .underlined-generated-word {
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .fake-link {
      color: var(--blue);
      text-decoration: none;
      cursor: default;
    }

    .plot-section {
      padding: clamp(1rem, 3vw, 1.5rem) var(--page-pad) clamp(2rem, 6vw, 3rem);
    }

    .plot-wrap {
      width: min(100%, var(--plot-max-width));
      margin: 0 auto;
    }

    .model-control,
    .variant-control {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 0 auto 12px;
    }

    .variant-control {
      margin: 8px auto;
    }

    .variant-control-bottom {
      margin-top: 5px;
      margin-bottom: 0;
    }

    .model-button,
    .variant-button {
      width: 40px;
      height: 32px;
      border: 1px solid var(--blue-border);
      border-radius: 999px;
      background: var(--blue-bg);
      color: var(--blue);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
      transition: background 0.15s ease, transform 0.15s ease;
      touch-action: manipulation;
    }

    .variant-button {
      font-size: 1.1rem;
    }

    .model-button:hover,
    .variant-button:hover {
      background: #e0e9ff;
      transform: scale(1.04);
    }

    .model-button:disabled,
    .variant-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .model-name {
      min-width: min(220px, 58vw);
      max-width: 70vw;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: #111;
      font-size: clamp(0.82rem, 2.5vw, 0.92rem);
      font-weight: 700;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sentence-box {
      min-height: 58px;
      padding: clamp(12px, 3vw, 16px) clamp(14px, 4vw, 24px);
      margin: 0 auto 24px;
      border-radius: 14px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      line-height: 1.5;
      font-size: clamp(0.95rem, 2.8vw, 1.05rem);
      text-align: left;
      overflow-wrap: anywhere;
    }

    .fixed-sentence {
      font-weight: 700;
      color: #111;
      white-space: pre-wrap;
    }

    .completed-part {
      font-weight: 700;
      display: inline;
      white-space: pre-wrap;
    }

    .completed-part.animate-text {
      opacity: 0;
      animation: fadeInText 0.55s ease forwards;
    }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 2px;
      background: currentColor;
      vertical-align: -0.12em;
      animation: blinkCursor 0.75s step-end infinite;
    }

    @keyframes blinkCursor {
      50% {
        opacity: 0;
      }
    }

    @keyframes fadeInText {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .variant-animated-area {
      will-change: transform, opacity;
    }

    .variant-slide-out-up {
      animation: slideOutUp 0.22s ease forwards;
    }

    .variant-slide-in-up {
      animation: slideInUp 0.28s ease forwards;
    }

    .variant-slide-out-down {
      animation: slideOutDown 0.22s ease forwards;
    }

    .variant-slide-in-down {
      animation: slideInDown 0.28s ease forwards;
    }

    @keyframes slideOutUp {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(-18px);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideOutDown {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(18px);
      }
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .model-slide-out-left {
      animation: modelSlideOutLeft 0.22s ease forwards;
    }

    .model-slide-in-left {
      animation: modelSlideInLeft 0.28s ease forwards;
    }

    .model-slide-out-right {
      animation: modelSlideOutRight 0.22s ease forwards;
    }

    .model-slide-in-right {
      animation: modelSlideInRight 0.28s ease forwards;
    }

    @keyframes modelSlideOutLeft {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(-22px);
      }
    }

    @keyframes modelSlideInLeft {
      from {
        opacity: 0;
        transform: translateX(22px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes modelSlideOutRight {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(22px);
      }
    }

    @keyframes modelSlideInRight {
      from {
        opacity: 0;
        transform: translateX(-22px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .variant-info {
      margin: 0 auto 10px;
      font-size: 0.82rem;
      color: #666;
      text-align: center;
    }

    .plot-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(14px, 2vw, 22px);
      align-items: start;
    }

    .plot-area {
      display: grid;
      grid-template-columns: clamp(30px, 5vw, 42px) minmax(0, 1fr);
      grid-template-rows: auto auto auto;
      column-gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .y-axis-label {
      grid-column: 1;
      grid-row: 1;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      text-align: center;
      font-weight: 700;
      font-size: clamp(0.72rem, 2vw, 0.9rem);
      justify-self: center;
    }

    .chart-wrapper {
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      min-width: 0;
      overflow-x: hidden;
      overflow-y: visible;
      padding-bottom: 36px;
      scrollbar-width: none;
    }

    .chart {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: var(--bar-gap);
      height: var(--chart-height);
      width: 100%;
      min-width: 0;
      padding: var(--chart-inner-pad-top) 6px 8px;
      overflow: visible;
      border-left: 2px solid #222;
      border-bottom: 2px solid #222;
      position: relative;
    }

    .cutoff-slider-panel {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      margin-top: 0;
      padding: 12px 6px 4px;
      position: relative;
    }

    .cutoff-side-label {
      position: absolute;
      left: -42px;
      top: 50%;
      transform: translateY(-50%) rotate(270deg);
      transform-origin: center;
      font-size: 0.78rem;
      font-weight: 800;
      color: #333;
      white-space: nowrap;
    }

    .cutoff-slider {
      width: 100%;
      appearance: none;
      background: transparent;
      cursor: pointer;
      display: block;
    }

    .cutoff-slider:focus {
      outline: none;
    }

    .cutoff-slider::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(
        90deg,
        var(--blue) 0%,
        var(--blue) var(--cutoff-progress, 0%),
        #e7ecff var(--cutoff-progress, 0%),
        #e7ecff 100%
      );
    }

    .cutoff-slider::-webkit-slider-thumb {
      appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -7px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--blue);
      box-shadow: 0 6px 14px rgba(50, 115, 220, 0.28);
    }

    .cutoff-slider::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: #e7ecff;
    }

    .cutoff-slider::-moz-range-progress {
      height: 8px;
      border-radius: 999px;
      background: var(--blue);
    }

    .cutoff-slider::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid var(--blue);
      box-shadow: 0 6px 14px rgba(50, 115, 220, 0.28);
    }

    .pr-panel {
      grid-column: 2;
      grid-row: 3;
      width: 100%;
      margin-top: 10px;
      padding: clamp(12px, 2.5vw, 14px);
      border-radius: 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
    }

    .pr-title {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .pr-chart {
      width: 100%;
      height: 260px;
    }

    .pr-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .pr-axis {
      stroke: #222;
      stroke-width: 1.5;
    }

    .pr-grid {
      stroke: #d9deef;
      stroke-width: 1;
    }

    .pr-line {
      fill: none;
      stroke-width: 3;
    }

    .pr-line-precision {
      stroke: #3273dc;
    }

    .pr-line-recall {
      stroke: #FF6843;
    }

    .pr-point {
      stroke: #fff;
      stroke-width: 2;
    }

    .pr-label {
      font-size: 11px;
      fill: #333;
    }

    .pr-legend {
      font-size: 12px;
      font-weight: 700;
    }

    .bar-group {
      width: var(--bar-group-width);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      position: relative;
      flex: 0 0 var(--bar-group-width);
    }

    .bar-value {
      font-size: var(--value-font-size);
      margin-bottom: 18px;
      color: #333;
      transform: rotate(-90deg);
      transform-origin: center;
      white-space: nowrap;
      height: 12px;
      pointer-events: none;
    }

    .bar {
      width: var(--bar-width);
      min-height: 2px;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      transition:
        height 0.38s ease,
        transform 0.18s ease,
        filter 0.18s ease,
        opacity 0.18s ease,
        background-color 0.18s ease;
      touch-action: manipulation;
    }

    .bar:hover {
      transform: scaleX(1.1);
      filter: brightness(0.88);
    }

    .error {
      color: #b00020;
      font-size: 0.95rem;
      margin-top: 12px;
      text-align: center;
    }

    @media (max-width: 760px) {
      :root {
        --chart-height: clamp(230px, 42vh, 330px);
      }

      .title.is-3 {
        font-size: clamp(1.4rem, 6vw, 2rem);
      }

      .subtitle.is-6 {
        font-size: 0.95rem;
      }

      .plot-area {
        grid-template-columns: 30px minmax(0, 1fr);
      }

      .chart-wrapper {
        padding-bottom: 42px;
        overflow-x: hidden;
      }

      .chart {
        width: 100%;
        min-width: 0;
      }

      .cutoff-side-label {
        left: -38px;
        font-size: 0.72rem;
      }

      .pr-panel {
        grid-column: 1 / -1;
        grid-row: 3;
      }
    }

    @media (max-width: 480px) {
      .model-control {
        gap: 8px;
      }

      .model-button,
      .variant-button {
        width: 36px;
        height: 30px;
      }

      .chart-wrapper {
        padding-bottom: 42px;
      }

      .cutoff-side-label {
        left: -34px;
        font-size: 0.68rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <section class="hero">
    <div class="hero-body">
      <div class="container is-max-desktop">
        <div class="columns is-centered">
          <div class="column has-text-centered">
            <h1 class="title is-1 publication-title">Interactive Token Probability Visualization</h1>

            <div class="centered">
              <span class="conf-text">Conference Demo</span>
            </div>

            <div class="is-size-5 publication-authors" style="margin-top: 10px;">
              <span class="author-block fake-link">Token probability barplot from JSON data</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section plot-section" aria-label="Token probability plot">
    <div class="container is-max-desktop">
      <div class="columns is-centered has-text-centered">
        <div class="column is-full">
          <h2 class="title is-3">Token Probability Barplot</h2>
          <p class="subtitle is-6">Hover or tap a token to show the completed sentence.</p>

          <div class="plot-wrap">
            <div class="model-control">
              <button class="model-button" id="modelLeftButton" type="button" aria-label="Previous model">
                ◀
              </button>

              <div class="model-name" id="modelName">
                Model
              </div>

              <button class="model-button" id="modelRightButton" type="button" aria-label="Next model">
                ▶
              </button>
            </div>

            <div class="variant-control">
              <button class="variant-button" id="variantUpButton" type="button" aria-label="Previous variant">
                ▲
              </button>
            </div>

            <div class="variant-animated-area" id="variantAnimatedArea">
              <div class="sentence-box" id="sentenceBox"></div>

              <div class="variant-info" id="variantInfo">
                Variant 1 of 1
              </div>

              <div class="plot-layout">
                <div class="plot-area">
                  <div class="y-axis-label">Token Probability (logscale)</div>

                  <div class="chart-wrapper">
                    <div class="chart" id="chart"></div>
                  </div>

                  <div class="cutoff-slider-panel">
                    <div class="cutoff-side-label">cutoff</div>

                    <input
                      id="cutoffSlider"
                      class="cutoff-slider"
                      type="range"
                      min="0"
                      max="0"
                      step="1"
                      value="0"
                      aria-label="Cutoff"
                    >
                  </div>

                  <div class="pr-panel">
                    <div class="pr-title">Precision and Recall</div>
                    <div class="pr-chart" id="prChart"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="variant-control variant-control-bottom">
              <button class="variant-button" id="variantDownButton" type="button" aria-label="Next variant">
                ▼
              </button>
            </div>

            <div class="error" id="errorBox"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const TEXT_ANIMATION_MODE = "typing";
    const TYPING_WORD_DELAY_MS = 50;

    const chart = document.getElementById("chart");
    const chartWrapper = document.querySelector(".chart-wrapper");
    const sentenceBox = document.getElementById("sentenceBox");
    const errorBox = document.getElementById("errorBox");

    const cutoffSlider = document.getElementById("cutoffSlider");
    const prChart = document.getElementById("prChart");

    const variantUpButton = document.getElementById("variantUpButton");
    const variantDownButton = document.getElementById("variantDownButton");
    const variantInfo = document.getElementById("variantInfo");
    const variantAnimatedArea = document.getElementById("variantAnimatedArea");

    const modelLeftButton = document.getElementById("modelLeftButton");
    const modelRightButton = document.getElementById("modelRightButton");
    const modelName = document.getElementById("modelName");

    const summaryKeySet = new Set([
      "valid",
      "invalid"
    ]);

    let loadedData = null;

    let modelNames = [];
    let selectedModelIndex = 0;
    let selectedModelName = null;

    let startTexts = [];
    let selectedStartIndex = 0;
    let selectedStartText = null;

    let selectedCutoffIndex = 0;

    let isChangingVariant = false;
    let isChangingModel = false;

    let currentTokenOrder = [];
    let currentDataArray = [];

    let typingTimerIds = [];
    let typingRunId = 0;

    function normalizeColor(color) {
      return String(color || "#3273dc").toUpperCase();
    }

    function isInvalidToken(item) {
      if (item.group) {
        return item.group === "invalid";
      }

      return normalizeColor(item.color) === "#FF6843";
    }

    function getTokenDisplayColor(item, index) {
      if (index <= selectedCutoffIndex) {
        return item.color;
      }

      if (isInvalidToken(item)) {
        return "#A2A2A2";
      }

      return "#CFCFCF";
    }

    function clearTypingTimers() {
      typingRunId += 1;

      typingTimerIds.forEach(timerId => {
        window.clearTimeout(timerId);
      });

      typingTimerIds = [];
    }

    function showDefaultSentence() {
      clearTypingTimers();

      const startText = selectedStartText || "";

      sentenceBox.innerHTML = `
        <span class="fixed-sentence">${escapeHTML(startText)}</span><span class="completed-part" style="color: black;">...</span>
      `;
    }

    async function loadData() {
      try {
        const response = await fetch(`data.json?v=${Date.now()}`, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("Could not load data.json");
        }

        loadedData = await response.json();
        modelNames = getModelNames(loadedData);

        if (modelNames.length === 0) {
          showDefaultSentence();
          clearPRChart();
          errorBox.textContent = "No valid model keys found in data.json.";
          return;
        }

        selectedModelIndex = 0;
        selectedModelName = modelNames[selectedModelIndex];

        setupModelButtons();
        setupVariantButtons();
        setupCurrentModel();

      } catch (error) {
        showDefaultSentence();
        clearPRChart();
        errorBox.textContent = "Could not read data.json. Run this page with a local server, not by directly opening the HTML file.";
      }
    }

    function getModelNames(data) {
      return Object.keys(data)
        .filter(key => {
          const value = data[key];
          return value && typeof value === "object" && !Array.isArray(value);
        });
    }

    function getStartTexts() {
      const modelData = loadedData[selectedModelName];

      return Object.keys(modelData)
        .filter(key => {
          const value = modelData[key];
          return value && typeof value === "object" && !Array.isArray(value);
        });
    }

    function setupModelButtons() {
      modelLeftButton.addEventListener("click", () => {
        changeModel("left");
      });

      modelRightButton.addEventListener("click", () => {
        changeModel("right");
      });
    }

    function changeModel(direction) {
      if (modelNames.length <= 1 || isChangingVariant || isChangingModel) {
        return;
      }

      isChangingModel = true;
      setAllButtonsDisabled(true);

      const outClass = direction === "left"
        ? "model-slide-out-left"
        : "model-slide-out-right";

      const inClass = direction === "left"
        ? "model-slide-in-left"
        : "model-slide-in-right";

      removeModelAnimationClasses();
      variantAnimatedArea.classList.add(outClass);

      window.setTimeout(() => {
        if (direction === "left") {
          selectedModelIndex -= 1;

          if (selectedModelIndex < 0) {
            selectedModelIndex = modelNames.length - 1;
          }
        } else {
          selectedModelIndex += 1;

          if (selectedModelIndex >= modelNames.length) {
            selectedModelIndex = 0;
          }
        }

        selectedModelName = modelNames[selectedModelIndex];
        setupCurrentModel();

        removeModelAnimationClasses();
        variantAnimatedArea.classList.add(inClass);

        window.setTimeout(() => {
          removeModelAnimationClasses();
          isChangingModel = false;
          setAllButtonsDisabled(false);
        }, 280);
      }, 220);
    }

    function setupCurrentModel() {
      errorBox.textContent = "";
      modelName.textContent = selectedModelName;

      startTexts = getStartTexts();

      if (startTexts.length === 0) {
        chart.innerHTML = "";
        currentTokenOrder = [];
        currentDataArray = [];
        showDefaultSentence();
        clearPRChart();
        errorBox.textContent = "No valid starting text keys found for this model.";
        return;
      }

      selectedStartIndex = 0;
      selectedStartText = startTexts[selectedStartIndex];

      setupCurrentVariant();
    }

    function setupVariantButtons() {
      variantUpButton.addEventListener("click", () => {
        changeVariant("up");
      });

      variantDownButton.addEventListener("click", () => {
        changeVariant("down");
      });
    }

    function changeVariant(direction) {
      if (startTexts.length <= 1 || isChangingVariant || isChangingModel) {
        return;
      }

      isChangingVariant = true;
      setAllButtonsDisabled(true);

      const outClass = direction === "up"
        ? "variant-slide-out-up"
        : "variant-slide-out-down";

      const inClass = direction === "up"
        ? "variant-slide-in-up"
        : "variant-slide-in-down";

      removeVariantAnimationClasses();
      variantAnimatedArea.classList.add(outClass);

      window.setTimeout(() => {
        if (direction === "up") {
          selectedStartIndex -= 1;

          if (selectedStartIndex < 0) {
            selectedStartIndex = startTexts.length - 1;
          }
        } else {
          selectedStartIndex += 1;

          if (selectedStartIndex >= startTexts.length) {
            selectedStartIndex = 0;
          }
        }

        selectedStartText = startTexts[selectedStartIndex];
        setupCurrentVariant();

        removeVariantAnimationClasses();
        variantAnimatedArea.classList.add(inClass);

        window.setTimeout(() => {
          removeVariantAnimationClasses();
          isChangingVariant = false;
          setAllButtonsDisabled(false);
        }, 280);
      }, 220);
    }

    function removeVariantAnimationClasses() {
      variantAnimatedArea.classList.remove(
        "variant-slide-out-up",
        "variant-slide-in-up",
        "variant-slide-out-down",
        "variant-slide-in-down"
      );
    }

    function removeModelAnimationClasses() {
      variantAnimatedArea.classList.remove(
        "model-slide-out-left",
        "model-slide-in-left",
        "model-slide-out-right",
        "model-slide-in-right"
      );
    }

    function setAllButtonsDisabled(disabled) {
      variantUpButton.disabled = disabled;
      variantDownButton.disabled = disabled;
      modelLeftButton.disabled = disabled;
      modelRightButton.disabled = disabled;
    }

    function setupCurrentVariant() {
      errorBox.textContent = "";

      variantInfo.textContent = `Variant ${selectedStartIndex + 1} of ${startTexts.length}`;

      selectedCutoffIndex = 0;

      const currentTokenData = getCurrentTokenData();

      if (!currentTokenData) {
        chart.innerHTML = "";
        currentTokenOrder = [];
        currentDataArray = [];
        showDefaultSentence();
        clearPRChart();
        errorBox.textContent = "No valid data found for this starting text.";
        return;
      }

      renderChart(currentTokenData);
    }

    function getCurrentTokenData() {
      if (!loadedData || !selectedModelName || !selectedStartText) {
        return null;
      }

      return loadedData[selectedModelName][selectedStartText];
    }

    function toDataArray(data) {
      return Object.entries(data)
        .filter(([key]) => !summaryKeySet.has(key))
        .map(([word, value]) => ({
          word,
          probability: Number(value.logit_value),
          completedSentence: value.completed_sentence,
          color: value.color || "#3273dc",
          group: value.group || "",
          precision: Number(value.precision),
          recall: Number(value.recall)
        }))
        .filter(item => Number.isFinite(item.probability) && item.probability > 0);
    }

    function getChartMaxBarHeight() {
      const chartHeight = chart.clientHeight || 280;
      return Math.max(120, chartHeight - 62);
    }

    function getLogHeight(probability, minProbability, maxProbability, maxBarHeight) {
      const minLog = Math.log10(minProbability);
      const maxLog = Math.log10(maxProbability);
      const valueLog = Math.log10(probability);

      if (maxLog === minLog) {
        return maxBarHeight;
      }

      const ratio = (valueLog - minLog) / (maxLog - minLog);
      return Math.max(2, ratio * maxBarHeight);
    }

    function renderChart(data) {
      chart.innerHTML = "";
      errorBox.textContent = "";
      showDefaultSentence();

      const dataArray = toDataArray(data);
      currentDataArray = dataArray;
      currentTokenOrder = dataArray.map(item => item.word);

      if (dataArray.length === 0) {
        clearPRChart();
        errorBox.textContent = "No valid positive probability values found for this selection.";
        return;
      }

      updateBarSizes(dataArray.length);
      setupCutoffSlider(dataArray);
      renderPRChart(dataArray);

      const probabilities = dataArray.map(item => item.probability);
      const minProbability = Math.min(...probabilities);
      const maxProbability = Math.max(...probabilities);
      const maxBarHeight = getChartMaxBarHeight();

      dataArray.forEach((item, index) => {
        const normalizedColor = normalizeColor(item.color);

        const barGroup = document.createElement("div");
        barGroup.className = "bar-group";
        barGroup.dataset.word = item.word;

        const value = document.createElement("div");
        value.className = "bar-value";
        value.textContent = formatValue(item.probability);

        const bar = document.createElement("div");
        bar.className = "bar";
        bar.dataset.word = item.word;
        bar.dataset.color = normalizedColor;
        bar.dataset.completedSentence = item.completedSentence;
        bar.dataset.originalColor = item.color;
        bar.setAttribute("role", "button");
        bar.setAttribute("tabindex", "0");
        bar.setAttribute("aria-label", `${item.word}, probability ${formatValue(item.probability)}`);

        bar.style.height = `${getLogHeight(
          item.probability,
          minProbability,
          maxProbability,
          maxBarHeight
        )}px`;

        bar.style.backgroundColor = getTokenDisplayColor(item, index);

        bar.addEventListener("mouseenter", () => {
          showCompletedSentence(bar);
        });

        bar.addEventListener("mouseleave", () => {
          showDefaultSentence();
        });

        bar.addEventListener("focus", () => {
          showCompletedSentence(bar);
        });

        bar.addEventListener("blur", () => {
          showDefaultSentence();
        });

        bar.addEventListener("click", () => {
          showCompletedSentence(bar);
        });

        barGroup.appendChild(value);
        barGroup.appendChild(bar);
        chart.appendChild(barGroup);
      });
    }

    function setupCutoffSlider(dataArray) {
      if (!dataArray || dataArray.length === 0) {
        cutoffSlider.min = 0;
        cutoffSlider.max = 0;
        cutoffSlider.value = 0;
        return;
      }

      cutoffSlider.min = 0;
      cutoffSlider.max = dataArray.length - 1;
      cutoffSlider.step = 1;

      selectedCutoffIndex = Math.min(selectedCutoffIndex, dataArray.length - 1);
      cutoffSlider.value = selectedCutoffIndex;

      updateCutoffUI(dataArray);
    }

    function updateCutoffUI(dataArray) {
      if (!dataArray || dataArray.length === 0) {
        return;
      }

      const maxIndex = Math.max(1, dataArray.length - 1);
      const progress = selectedCutoffIndex / maxIndex * 100;

      cutoffSlider.style.setProperty("--cutoff-progress", `${progress}%`);
    }

    cutoffSlider.addEventListener("input", () => {
      if (isChangingVariant || isChangingModel) {
        return;
      }

      selectedCutoffIndex = Number(cutoffSlider.value);

      updateCutoffUI(currentDataArray);
      updateBarColorsByCutoff();
      renderPRChart(currentDataArray);
    });

    function updateBarColorsByCutoff() {
      const barGroups = Array.from(chart.querySelectorAll(".bar-group"));

      currentDataArray.forEach((item, index) => {
        const barGroup = barGroups[index];

        if (!barGroup) {
          return;
        }

        const bar = barGroup.querySelector(".bar");

        if (!bar) {
          return;
        }

        bar.style.backgroundColor = getTokenDisplayColor(item, index);
      });
    }

    function clearPRChart() {
      prChart.innerHTML = "";
    }

    function renderPRChart(dataArray) {
      prChart.innerHTML = "";

      if (!dataArray || dataArray.length === 0) {
        return;
      }

      const validItems = dataArray.filter(item => {
        return Number.isFinite(item.precision) && Number.isFinite(item.recall);
      });

      if (validItems.length === 0) {
        return;
      }

      const svgNS = "http://www.w3.org/2000/svg";

      const width = 900;
      const height = 260;

      const margin = {
        top: 24,
        right: 28,
        bottom: 38,
        left: 76
      };

      const innerWidth = width - margin.left - margin.right;
      const innerHeight = height - margin.top - margin.bottom;

      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("class", "pr-svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const xMax = Math.max(1, validItems.length - 1);

      function xScale(index) {
        return margin.left + index / xMax * innerWidth;
      }

      function yScale(value) {
        return margin.top + (1 - value) * innerHeight;
      }

      for (let i = 0; i <= 4; i++) {
        const yValue = i / 4;
        const y = yScale(yValue);

        const grid = document.createElementNS(svgNS, "line");
        grid.setAttribute("class", "pr-grid");
        grid.setAttribute("x1", margin.left);
        grid.setAttribute("y1", y);
        grid.setAttribute("x2", width - margin.right);
        grid.setAttribute("y2", y);
        svg.appendChild(grid);

        const label = document.createElementNS(svgNS, "text");
        label.setAttribute("class", "pr-label");
        label.setAttribute("x", margin.left - 12);
        label.setAttribute("y", y + 4);
        label.setAttribute("text-anchor", "end");
        label.textContent = yValue.toFixed(2);
        svg.appendChild(label);
      }

      const xAxis = document.createElementNS(svgNS, "line");
      xAxis.setAttribute("class", "pr-axis");
      xAxis.setAttribute("x1", margin.left);
      xAxis.setAttribute("y1", height - margin.bottom);
      xAxis.setAttribute("x2", width - margin.right);
      xAxis.setAttribute("y2", height - margin.bottom);
      svg.appendChild(xAxis);

      const yAxis = document.createElementNS(svgNS, "line");
      yAxis.setAttribute("class", "pr-axis");
      yAxis.setAttribute("x1", margin.left);
      yAxis.setAttribute("y1", margin.top);
      yAxis.setAttribute("x2", margin.left);
      yAxis.setAttribute("y2", height - margin.bottom);
      svg.appendChild(yAxis);

      const precisionPoints = validItems.map((item, index) => {
        return `${xScale(index)},${yScale(item.precision)}`;
      });

      const recallPoints = validItems.map((item, index) => {
        return `${xScale(index)},${yScale(item.recall)}`;
      });

      const precisionLine = document.createElementNS(svgNS, "polyline");
      precisionLine.setAttribute("class", "pr-line pr-line-precision");
      precisionLine.setAttribute("points", precisionPoints.join(" "));
      svg.appendChild(precisionLine);

      const recallLine = document.createElementNS(svgNS, "polyline");
      recallLine.setAttribute("class", "pr-line pr-line-recall");
      recallLine.setAttribute("points", recallPoints.join(" "));
      svg.appendChild(recallLine);

      const safeCutoff = Math.max(0, Math.min(selectedCutoffIndex, validItems.length - 1));
      const selectedItem = validItems[safeCutoff];

      if (selectedItem) {
        const selectedX = xScale(safeCutoff);

        const verticalLine = document.createElementNS(svgNS, "line");
        verticalLine.setAttribute("x1", selectedX);
        verticalLine.setAttribute("y1", margin.top);
        verticalLine.setAttribute("x2", selectedX);
        verticalLine.setAttribute("y2", height - margin.bottom);
        verticalLine.setAttribute("stroke", "#888");
        verticalLine.setAttribute("stroke-width", "1.5");
        verticalLine.setAttribute("stroke-dasharray", "5 5");
        svg.appendChild(verticalLine);

        const precisionPoint = document.createElementNS(svgNS, "circle");
        precisionPoint.setAttribute("class", "pr-point");
        precisionPoint.setAttribute("cx", selectedX);
        precisionPoint.setAttribute("cy", yScale(selectedItem.precision));
        precisionPoint.setAttribute("r", 6);
        precisionPoint.setAttribute("fill", "#3273dc");
        svg.appendChild(precisionPoint);

        const recallPoint = document.createElementNS(svgNS, "circle");
        recallPoint.setAttribute("class", "pr-point");
        recallPoint.setAttribute("cx", selectedX);
        recallPoint.setAttribute("cy", yScale(selectedItem.recall));
        recallPoint.setAttribute("r", 6);
        recallPoint.setAttribute("fill", "#FF6843");
        svg.appendChild(recallPoint);
      }

      const xLabel = document.createElementNS(svgNS, "text");
      xLabel.setAttribute("class", "pr-label");
      xLabel.setAttribute("x", width / 2);
      xLabel.setAttribute("y", height - 8);
      xLabel.setAttribute("text-anchor", "middle");
      xLabel.textContent = "Cutoff position";
      svg.appendChild(xLabel);

      const yLabel = document.createElementNS(svgNS, "text");
      yLabel.setAttribute("class", "pr-label");
      yLabel.setAttribute("x", 18);
      yLabel.setAttribute("y", height / 2);
      yLabel.setAttribute("text-anchor", "middle");
      yLabel.setAttribute("transform", `rotate(-90 18 ${height / 2})`);
      yLabel.textContent = "Score";
      svg.appendChild(yLabel);

      const precisionLegend = document.createElementNS(svgNS, "text");
      precisionLegend.setAttribute("class", "pr-legend");
      precisionLegend.setAttribute("x", width - margin.right - 170);
      precisionLegend.setAttribute("y", 18);
      precisionLegend.setAttribute("fill", "#3273dc");
      precisionLegend.textContent = "Precision";
      svg.appendChild(precisionLegend);

      const recallLegend = document.createElementNS(svgNS, "text");
      recallLegend.setAttribute("class", "pr-legend");
      recallLegend.setAttribute("x", width - margin.right - 82);
      recallLegend.setAttribute("y", 18);
      recallLegend.setAttribute("fill", "#FF6843");
      recallLegend.textContent = "Recall";
      svg.appendChild(recallLegend);

      prChart.appendChild(svg);
    }

    function showCompletedSentence(bar) {
      clearTypingTimers();

      const completedSentence = bar.dataset.completedSentence || "";
      const color = bar.dataset.originalColor || "#111";
      const startText = selectedStartText || "";

      if (TEXT_ANIMATION_MODE === "typing") {
        showTypingSentence(startText, completedSentence, color);
        return;
      }

      showFadeSentence(startText, completedSentence, color);
    }

    function showFadeSentence(startText, completedSentence, color) {
      const cleanedSentence = String(completedSentence).trim();

      if (!cleanedSentence) {
        sentenceBox.innerHTML = `
          <span class="fixed-sentence">${escapeHTML(startText)}</span>
        `;
        return;
      }

      const words = cleanedSentence.split(/\s+/);
      const firstWord = words.shift() || "";
      const restText = words.length > 0 ? ` ${words.join(" ")}` : "";

      sentenceBox.innerHTML = `
        <span class="fixed-sentence">${escapeHTML(startText)}</span><span class="completed-part animate-text" style="color: ${escapeHTML(color)};"><span class="underlined-generated-word">${escapeHTML(firstWord)}</span>${escapeHTML(restText)}</span>
      `;
    }

    function showTypingSentence(startText, completedSentence, color) {
      const runId = typingRunId;

      sentenceBox.innerHTML = `
        <span class="fixed-sentence">${escapeHTML(startText)}</span><span class="completed-part" id="typingCompletedPart" style="color: ${escapeHTML(color)};"></span>
      `;

      const typingCompletedPart = document.getElementById("typingCompletedPart");

      if (!typingCompletedPart) {
        return;
      }

      const cleanedSentence = String(completedSentence)
        .replace(/([.!?])(?=[A-Za-z])/g, "$1 ")
        .trim();

      const words = cleanedSentence
        .split(/\s+/)
        .filter(Boolean);

      if (words.length === 0) {
        return;
      }

      const cursor = document.createElement("span");
      cursor.className = "typing-cursor";
      cursor.style.color = color;

      typingCompletedPart.appendChild(cursor);

      words.forEach((word, index) => {
        const timerId = window.setTimeout(() => {
          if (runId !== typingRunId) {
            return;
          }

          typingCompletedPart.innerHTML = "";

          words.slice(0, index + 1).forEach((shownWord, shownIndex) => {
            if (shownIndex > 0) {
              typingCompletedPart.appendChild(document.createTextNode(" "));
            }

            if (shownIndex === 0) {
              const underlinedWord = document.createElement("span");
              underlinedWord.className = "underlined-generated-word";
              underlinedWord.textContent = shownWord;
              typingCompletedPart.appendChild(underlinedWord);
            } else {
              typingCompletedPart.appendChild(document.createTextNode(shownWord));
            }
          });

          typingCompletedPart.appendChild(cursor);

          if (index === words.length - 1) {
            const removeCursorTimerId = window.setTimeout(() => {
              if (runId !== typingRunId) {
                return;
              }

              cursor.remove();
            }, 350);

            typingTimerIds.push(removeCursorTimerId);
          }
        }, index * TYPING_WORD_DELAY_MS);

        typingTimerIds.push(timerId);
      });
    }

    function updateBarHeights(dataArray) {
      if (!dataArray || dataArray.length === 0) {
        return;
      }

      const probabilities = dataArray.map(item => item.probability);
      const minProbability = Math.min(...probabilities);
      const maxProbability = Math.max(...probabilities);
      const maxBarHeight = getChartMaxBarHeight();

      const barGroups = Array.from(chart.querySelectorAll(".bar-group"));

      dataArray.forEach((item, index) => {
        const barGroup = barGroups[index];

        if (!barGroup) {
          return;
        }

        const value = barGroup.querySelector(".bar-value");
        const bar = barGroup.querySelector(".bar");

        if (!bar || !value) {
          return;
        }

        value.textContent = formatValue(item.probability);
        bar.dataset.completedSentence = item.completedSentence;
        bar.dataset.originalColor = item.color;
        bar.dataset.color = normalizeColor(item.color);
        bar.style.backgroundColor = getTokenDisplayColor(item, index);
        bar.setAttribute("aria-label", `${item.word}, probability ${formatValue(item.probability)}`);

        bar.style.height = `${getLogHeight(
          item.probability,
          minProbability,
          maxProbability,
          maxBarHeight
        )}px`;
      });
    }

    function updateBarSizes(count) {
      const wrapperWidth = chartWrapper.clientWidth || 520;
      const isMobile = window.innerWidth <= 760;

      let gap = 8;

      if (isMobile) {
        if (count > 36) {
          gap = 0;
        } else if (count > 28) {
          gap = 1;
        } else if (count > 18) {
          gap = 2;
        } else {
          gap = 3;
        }
      } else {
        if (count > 36) {
          gap = 1;
        } else if (count > 28) {
          gap = 2;
        } else if (count > 18) {
          gap = 4;
        }
      }

      const availableWidth = Math.max(160, wrapperWidth - 12);

      let groupWidth = Math.floor(
        (availableWidth - gap * Math.max(0, count - 1)) / Math.max(1, count)
      );

      if (isMobile) {
        groupWidth = Math.max(6, groupWidth);
      } else {
        const minGroupWidth = count > 36 ? 12 : count > 28 ? 14 : count > 18 ? 18 : 28;
        groupWidth = Math.max(minGroupWidth, groupWidth);
      }

      const barWidth = isMobile
        ? Math.max(3, Math.min(18, Math.floor(groupWidth * 0.72)))
        : Math.max(5, Math.min(30, Math.floor(groupWidth * 0.7)));

      const valueFontSize = isMobile
        ? groupWidth < 9 ? 5 : groupWidth < 13 ? 6 : 7
        : groupWidth < 16 ? 7 : groupWidth < 24 ? 8 : 10;

      chart.style.setProperty("--bar-gap", `${gap}px`);
      chart.style.setProperty("--bar-group-width", `${groupWidth}px`);
      chart.style.setProperty("--bar-width", `${barWidth}px`);
      chart.style.setProperty("--value-font-size", `${valueFontSize}px`);
    }

    function refreshResponsiveChart() {
      if (!currentDataArray || currentDataArray.length === 0) {
        return;
      }

      updateBarSizes(currentDataArray.length);
      updateBarHeights(currentDataArray);
      updateCutoffUI(currentDataArray);
      updateBarColorsByCutoff();
      renderPRChart(currentDataArray);
    }

    const resizeObserver = new ResizeObserver(() => {
      window.requestAnimationFrame(refreshResponsiveChart);
    });

    resizeObserver.observe(chartWrapper);
    resizeObserver.observe(chart);

    function formatValue(number) {
      if (Number.isInteger(number)) {
        return String(number);
      }

      return number
        .toFixed(6)
        .replace(/0+$/, "")
        .replace(/\.$/, "");
    }

    function escapeHTML(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadData();
  </script>
</body>
</html>
